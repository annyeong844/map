name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # source tests need >=23.6 native TS type-stripping; the package ships JS
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run check:native
      - run: npm run build:native
      - run: npm run smoke:native
      - run: npm run typecheck # tsc --noEmit, strict
      - run: npm test
      - run: node --test test/python.test.ts
        env:
          CODE_MAP_PY_BACKEND: stdlib
      - run: npm run lint # oxlint (correctness)
      - run: npm run check:versions
      - run: npm run check:package
      - run: npm run smoke:package # install the tarball in a fresh prefix; exercise CLI + real stdio MCP schema/call
      - run: npm audit --omit=dev
      - run: npm ci
        working-directory: code-oracle
      - run: npm run typecheck
        working-directory: code-oracle
      - run: npm test
        working-directory: code-oracle
      - run: npm audit --omit=dev
        working-directory: code-oracle
